# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Next.js 15, LangGraph.js, FastAPI, gRPC, Prisma.
  Architecture: Hierarchical Agent Swarm (Mirror -> CEO -> Chiefs -> Workers).
  Testing: Jest (Backend), Pytest (AI Engine).
  Style: ESLint, Prettier, Ruff, Black.

strict_tdd: true

rules:
  proposal:
    - Identify affected modules (Frontend, Backend, AI Engine).
    - Link to existing architectural backlog items.
  specs:
    - Must follow Sacred Laws (AGENTS.md).
    - Define Gherkin scenarios for agent reasoning loops.
  design:
    - Include Mermaid sequence diagrams for gRPC/LangGraph flows.
    - Document ADLs (Architecture Decision Logs).
  tasks:
    - Group by domain: Software, Business, Operations.
    - Max 5 tasks per change batch.

testing:
  runner:
    command: "npm run test"
    framework: "Jest/Pytest"
  layers:
    unit: true
    integration: true
    e2e: false
