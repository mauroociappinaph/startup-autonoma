schema: spec-driven

context: |
  Tech stack: Turborepo, Node.js (TS), LangGraph.js, Next.js 15, Python (FastAPI).
  Architecture: Hexagonal/Clean (Chiefs/Workers), gRPC communication.
  Testing: Jest (Backend), Turbo-driven scripts.
  Style: ESLint, Prettier, strict typing (No Any).

strict_tdd: true

testing:
  runner:
    command: "npm run test"
    framework: "jest"
  linter:
    command: "npm run lint"
  type_checker:
    command: "npm run check"

rules:
  proposal:
    - Include path alias verification
    - Identify affected modules
  specs:
    - Given/When/Then format
  design:
    - Document architecture changes
  tasks:
    - Small, atomic tasks
  apply:
    - Reasoning-first rule
    - Strict XML formatting
  verify:
    - Compare against all spec scenarios
