syntax = "proto3";

package ai_engine;

import "google/protobuf/struct.proto";

// Servicio principal del Motor de IA
service AIEngine {
  // Ejecuta una tarea técnica pesada (ej: scraping, análisis de datos)
  rpc ExecuteWorkerTask (WorkerTaskRequest) returns (WorkerTaskResponse);

  // Permite ver el razonamiento y progreso del worker en tiempo real
  rpc StreamWorkerProgress (WorkerTaskRequest) returns (stream WorkerProgressUpdate);

  // Verifica la salud del servidor
  rpc Ping (Empty) returns (PingResponse);
}

// Mensaje vacío para solicitudes de salud
message Empty {}

// Respuesta de salud
message PingResponse {
  string status = 1;
}

// Solicitud de tarea para un Worker de Python
message WorkerTaskRequest {
  string worker_name = 1;      // Nombre del worker (ej: "lead_gen", "market_analyst")
  string task_description = 2; // Descripción en lenguaje natural de la tarea
  string trace_id = 3;         // Identificador único para trazabilidad distribuida
  google.protobuf.Struct payload = 4; // Datos estructurados de entrada
}

// Respuesta final de la tarea
message WorkerTaskResponse {
  bool success = 1;
  string message = 2;          // Mensaje de estado o resumen
  google.protobuf.Struct result = 3; // El resultado final (leads, datos, etc.)
  string error_code = 4;       // Código de error si success es false
}

// Actualización de progreso (para streaming)
message WorkerProgressUpdate {
  string status = 1;           // Estado actual (ej: "scraping_linkedin", "parsing_data")
  float progress_percentage = 2;
  string log_message = 3;      // Mensaje detallado de lo que está haciendo el agente
  string trace_id = 4;
}
