name: CI Validation - Sacred Laws

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validate:
    name: "Architectural Audit & Quality Check"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Turbo y Git Diff funcionen correctamente

      - name: 🟢 Setup Node.js (v24 Elite)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build Shared Library (Physical)
        run: |
          rm -rf packages/shared/dist
          npm run build --workspace=@startup/shared

      - name: 🏗️ Build & Validate Type References (Monorepo)
        run: npx tsc --build --force

      - name: 🏗️ Run Architectural Audit (Sacred Laws)
        run: npm run check-laws
        env:
          CI: "true"
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: 🧪 Install Python Dependencies & Run Tests
        working-directory: ai-engine
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .
          npm run test
          npm run lint

      - name: 🚀 Run Monorepo Validation (Turbo-Differential)
        run: npx turbo run lint check test build --filter="...[origin/${{ github.base_ref || 'develop' }}]" --concurrency=100%

  aduana-gatekeeper:
    name: "Aduana Gatekeeper (Review Routing)"
    needs: validate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 🟢 Route to Needs Review (Pass)
        if: ${{ needs.validate.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "👀 status:needs-review" --remove-label "⚠️ status:needs-changes" || true
          
      - name: 🔴 Route to Needs Changes (Fail)
        if: ${{ needs.validate.result != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "⚠️ status:needs-changes" --remove-label "👀 status:needs-review" || true
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "🚨 **Aduana Gatekeeper:** El pipeline ha fallado. Revisa los logs del CI y corrige los errores antes de solicitar revisión humana." || true
