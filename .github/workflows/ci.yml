name: CI Validation - Sacred Laws

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validate-sacred-laws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install # Asume que el package.json estará en root o backend

      - name: Run Sacred Laws Verification
        run: node scripts/verify-sacred-laws.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest ruff
          python3 -m pip install ./ai-engine

      - name: Debug Python Environment
        run: |
          which python3
          python3 --version
          python3 -m pytest --version
          pytest --version || echo "pytest binary not in PATH"

      - name: Run CI tasks in parallel (Turbo)
        run: npx turbo run lint check test build
